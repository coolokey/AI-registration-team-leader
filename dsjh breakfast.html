                                            required
                                            defaultValue=""
                                            className="w-full mt-1 border-4 border-black rounded-xl p-3 font-bold bg-yellow-50 focus:ring-0 focus:border-orange-500 transition-colors cursor-pointer hover:bg-orange-50"
                                        >
                                            <option value="" disabled>請選擇您的職稱姓名</option>
                                            {nameOptions.map(name => (
                                                <option key={name} value={name}>{name}</option>
                                            ))}
                                        </select>
                                    </label>
                                </div>
                            </section>

                            {/* 三天餐點動態卡片 */}
                            {[
                                { date: "4/26 (日)", drinkKey: "drink_426", foodKey: "food_426", stars: 2 },
                                { date: "5/16 (六)", drinkKey: "drink_516", foodKey: "food_516", stars: 3 },
                                { date: "5/17 (日)", drinkKey: "drink_517", foodKey: "food_517", stars: 4 }
                            ].map((day, idx) => (
                                <section key={idx} className="bg-white border-4 border-black rounded-3xl p-6 shadow-[8px_8px_0px_rgba(0,0,0,1)] relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-blue-100 transform translate-x-12 -translate-y-12 rotate-45 border-b-4 border-l-4 border-black z-0"></div>
                                    
                                    <div className="flex items-center mb-6 relative z-10">
                                        <DragonBallIcon count={day.stars} />
                                        <h2 className="text-2xl font-black text-black">{day.date} 選餐</h2>
                                    </div>

                                    {/* 飲料選擇區 */}
                                    <div className="mb-8 relative z-10">
                                        <h3 className="text-lg font-black text-gray-800 mb-4 flex items-center border-l-8 border-orange-500 pl-3">
                                            <Coffee size={24} className="mr-2 text-orange-600" /> 選擇飲料
                                        </h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            {drinkOptions.map((option, i) => (
                                                <label key={i} className="relative group cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name={entryIds[day.drinkKey]} 
                                                        value={option.label} 
                                                        required
                                                        className="peer sr-only"
                                                    />
                                                    <div className="h-full border-4 border-gray-200 rounded-xl overflow-hidden transition-all peer-checked:border-orange-500 peer-checked:bg-orange-50 peer-checked:shadow-[4px_4px_0px_rgba(0,0,0,1)] hover:border-gray-400 bg-white flex flex-col">
                                                        <div className="aspect-[4/3] w-full bg-gray-100 overflow-hidden border-b-2 border-gray-200">
                                                            <img 
                                                                src={option.image} 
                                                                alt={option.label}
                                                                className="w-full h-full object-cover transition-transform group-hover:scale-110"
                                                                loading="lazy"
                                                            />
                                                        </div>
                                                        <div className="p-3 text-center flex-grow flex items-center justify-center">
                                                            <span className="font-bold text-gray-700 peer-checked:text-black">{option.label}</span>
                                                        </div>
                                                    </div>
                                                    <div className="absolute top-2 right-2 hidden peer-checked:block bg-green-500 text-white rounded-full p-1 border-2 border-black">
                                                        <CheckCircle2 size={16} />
                                                    </div>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 餐點選擇區 */}
                                    <div className="relative z-10">
                                        <h3 className="text-lg font-black text-gray-800 mb-4 flex items-center border-l-8 border-orange-500 pl-3">
                                            <Utensils size={24} className="mr-2 text-orange-600" /> 選擇餐點
                                        </h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            {foodOptions.map((option, i) => (
                                                <label key={i} className="relative group cursor-pointer">
                                                    <input 
                                                        type="radio" 
                                                        name={entryIds[day.foodKey]} 
                                                        value={option.label} 
                                                        required
                                                        className="peer sr-only"
                                                    />
                                                    <div className="h-full border-4 border-gray-200 rounded-xl overflow-hidden transition-all peer-checked:border-orange-500 peer-checked:bg-orange-50 peer-checked:shadow-[4px_4px_0px_rgba(0,0,0,1)] hover:border-gray-400 bg-white flex flex-col">
                                                        <div className="aspect-[4/3] w-full bg-gray-100 overflow-hidden border-b-2 border-gray-200">
                                                            <img 
                                                                src={option.image} 
                                                                alt={option.label}
                                                                className="w-full h-full object-cover transition-transform group-hover:scale-110"
                                                                loading="lazy"
                                                            />
                                                        </div>
                                                        <div className="p-3 text-center flex-grow flex items-center justify-center">
                                                            <span className="font-bold text-gray-700 text-sm md:text-base peer-checked:text-black">{option.label}</span>
                                                        </div>
                                                    </div>
                                                    <div className="absolute top-2 right-2 hidden peer-checked:block bg-green-500 text-white rounded-full p-1 border-2 border-black">
                                                        <CheckCircle2 size={16} />
                                                    </div>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                </section>
                            ))}

                            {/* 備註區塊 */}
                            <section className="bg-white border-4 border-black rounded-3xl p-6 shadow-[8px_8px_0px_rgba(0,0,0,1)]">
                                <div className="flex items-center mb-6">
                                    <DragonBallIcon count={7} />
                                    <h2 className="text-2xl font-black text-black">備註與微調</h2>
                                </div>
                                <label className="block">
                                    <span className="text-gray-700 font-black mb-2 flex items-center">
                                        <MessageSquare size={18} className="mr-2 text-orange-500" /> 特殊需求請加註
                                    </span>
                                    <textarea 
                                        name={entryIds.note} 
                                        rows="3"
                                        placeholder="例如：去冰、不加醬、或是其他想對教務處說的話..."
                                        className="w-full mt-1 border-4 border-black rounded-xl p-3 font-bold bg-yellow-50 focus:ring-0 focus:border-orange-500 transition-colors"
                                    ></textarea>
                                </label>
                            </section>

                            {/* 提交按鈕 */}
                            <div className="text-center pt-6 pb-12">
                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className={`
                                        group inline-flex items-center justify-center 
                                        bg-orange-500 hover:bg-orange-600 
                                        text-white text-2xl font-black py-4 px-12 rounded-full 
                                        border-4 border-black shadow-[8px_8px_0px_rgba(0,0,0,0.8)] 
                                        transition-all transform hover:scale-105 active:translate-x-1 active:translate-y-1 
                                        relative overflow-hidden disabled:opacity-70 disabled:cursor-not-allowed
                                    `}
                                >
                                    {loading ? (
                                        <span className="relative z-10 flex items-center">
                                            <svg className="animate-spin -ml-1 mr-3 h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                            集氣中...
                                        </span>
                                    ) : (
                                        <span className="relative z-10 flex items-center">發動！超級點餐波 <Send className="ml-3 group-hover:translate-x-1 transition-transform" /></span>
                                    )}
                                    <div className="absolute inset-0 bg-white/20 transform -translate-x-full group-hover:translate-x-full transition-transform duration-500"></div>
                                </button>
                                <p className="mt-4 text-gray-500 font-bold">請確認所有欄位均已選取，送出後將無法自行修改</p>
                            </div>
                        </form>
                    </div>

                    {/* Footer */}
                    <footer className="mt-8 py-8 text-center text-gray-600 font-bold bg-white/50 border-t-4 border-black">
                        <p>© 115學年度 大溪國中教務處 敬上</p>
                        <div className="flex justify-center mt-4 space-x-2">
                            {[...Array(7)].map((_, i) => (
                                <div key={i} className="w-4 h-4 bg-orange-500 rounded-full border-2 border-black shadow-[1px_1px_0px_black]"></div>
                            ))}
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
