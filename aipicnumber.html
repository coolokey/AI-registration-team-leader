<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 藝術能量掃描儀</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

body{
font-family:'Noto Sans TC',sans-serif;
background:#0f172a;
color:white;
overflow-x:hidden;
}

*{user-select:none;}

.glass{
background:rgba(30,41,59,0.7);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
}

.scanner{
position:absolute;
width:100%;
height:4px;
background:#06b6d4;
box-shadow:0 0 20px #06b6d4;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{top:0}
50%{top:100%}
100%{top:0}
}

.confetti{
position:absolute;
width:10px;
height:10px;
opacity:0;
}

@keyframes fall{
0%{transform:translateY(-100vh);opacity:1}
100%{transform:translateY(100vh) rotate(360deg);opacity:0}
}

::-webkit-scrollbar{display:none;}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div id="app" class="w-full max-w-md mx-auto relative h-[850px] max-h-[90vh]">

<!-- LOGIN -->
<div id="login" class="absolute inset-0 glass rounded-3xl p-8 flex flex-col justify-center">

<h1 class="text-3xl font-black text-center mb-6 text-cyan-400">
AI 藝術能量掃描儀
</h1>

<input id="studentId"
class="bg-slate-800 p-3 rounded-xl mb-3"
placeholder="班級座號">

<input id="studentName"
class="bg-slate-800 p-3 rounded-xl mb-3"
placeholder="姓名">

<input id="apiKey"
class="bg-slate-800 p-3 rounded-xl mb-4"
placeholder="Gemini API Key (選填)">

<button onclick="enterTheme()"
class="bg-cyan-500 p-3 rounded-xl font-bold">
開始掃描
</button>

</div>

<!-- THEME -->
<div id="theme"
class="hidden absolute inset-0 glass rounded-3xl p-6">

<h2 class="text-xl font-bold mb-6 text-center text-cyan-400">
選擇主題
</h2>

<div class="space-y-4">

<button onclick="selectTheme('動漫人物')" class="btn">動漫人物</button>
<button onclick="selectTheme('自然風景')" class="btn">自然風景</button>
<button onclick="selectTheme('機械設計')" class="btn">機械設計</button>
<button onclick="selectTheme('可愛吉祥物')" class="btn">可愛吉祥物</button>

</div>

</div>

<!-- CROP -->
<div id="crop"
class="hidden absolute inset-0 glass rounded-3xl p-6 flex flex-col">

<h2 id="themeTitle" class="text-center mb-4"></h2>

<div id="cropArea"
class="relative w-full aspect-square bg-black rounded-xl overflow-hidden mb-4">

<label id="uploadLabel"
class="absolute inset-0 flex items-center justify-center cursor-pointer">

<i class="fas fa-upload text-4xl"></i>

<input type="file"
id="imageInput"
accept="image/*"
class="hidden"
onchange="loadImage(event)">

</label>

<img id="img"
class="absolute hidden"
draggable="false">

<div id="mask"
class="absolute pointer-events-none hidden"
style="
box-shadow:0 0 0 9999px rgba(15,23,42,0.85);
border-radius:50%;
border:3px dashed #06b6d4;
width:80%;
aspect-ratio:1;
top:50%;
left:50%;
transform:translate(-50%,-50%);
">
</div>

</div>

<input type="range"
id="zoom"
min="0.5"
max="3"
step="0.05"
value="1"
class="hidden mb-4">

<button id="scanBtn"
onclick="submitAI()"
class="hidden bg-purple-500 p-3 rounded-xl">
送交 AI 分析
</button>

</div>

<!-- LOADING -->
<div id="loading"
class="hidden absolute inset-0 glass rounded-3xl flex flex-col items-center justify-center">

<h2 class="mb-6 text-cyan-400 animate-pulse">AI 分析中...</h2>

<div class="relative w-40 h-40 rounded-full overflow-hidden border-4 border-cyan-500">

<img id="preview" class="w-full h-full object-cover">

<div class="scanner"></div>

</div>

</div>

<!-- RESULT -->
<div id="result"
class="hidden absolute inset-0 glass rounded-3xl p-6 text-center">

<h2 id="resultTitle" class="text-xl font-black mb-4"></h2>

<img id="resultImg"
class="w-32 h-32 mx-auto rounded-full border mb-4">

<div class="text-4xl font-black mb-4" id="score">
0
</div>

<p id="feedback" class="text-sm mb-4"></p>

<button onclick="resetApp()"
class="bg-green-500 p-3 rounded-xl">
重新掃描
</button>

</div>

</div>

<script>

let appData={
theme:"",
apiKey:"",
imageBase64:""
}

function show(id){
document.querySelectorAll("#app > div")
.forEach(e=>e.classList.add("hidden"))

document.getElementById(id).classList.remove("hidden")
}

function enterTheme(){

appData.apiKey=document.getElementById("apiKey").value

show("theme")

}

function selectTheme(t){

appData.theme=t
document.getElementById("themeTitle").innerText="主題："+t

show("crop")

}

const img=document.getElementById("img")
const cropArea=document.getElementById("cropArea")

let state={
x:0,
y:0,
scale:1,
baseW:0,
baseH:0
}

function loadImage(e){

const file=e.target.files[0]
if(!file)return

const reader=new FileReader()

reader.onload=r=>{

img.src=r.target.result

img.onload=()=>{

document.getElementById("uploadLabel").classList.add("hidden")
img.classList.remove("hidden")
document.getElementById("mask").classList.remove("hidden")
document.getElementById("zoom").classList.remove("hidden")
document.getElementById("scanBtn").classList.remove("hidden")

const size=cropArea.clientWidth

const ratio=img.naturalWidth/img.naturalHeight

if(ratio>1){
state.baseH=size
state.baseW=size*ratio
}else{
state.baseW=size
state.baseH=size/ratio
}

state.x=(size-state.baseW)/2
state.y=(size-state.baseH)/2

updateImg()

}

}

reader.readAsDataURL(file)

}

function updateImg(){

img.style.width=state.baseW+"px"
img.style.height=state.baseH+"px"

img.style.transform=
`translate(${state.x}px,${state.y}px) scale(${state.scale})`

img.style.transformOrigin="top left"

}

document.getElementById("zoom").addEventListener("input",e=>{
state.scale=parseFloat(e.target.value)
updateImg()
})

let dragging=false,startX,startY

img.addEventListener("mousedown",e=>{
dragging=true
startX=e.clientX
startY=e.clientY
})

window.addEventListener("mousemove",e=>{

if(!dragging)return

state.x+=e.clientX-startX
state.y+=e.clientY-startY

startX=e.clientX
startY=e.clientY

updateImg()

})

window.addEventListener("mouseup",()=>dragging=false)

async function submitAI(){

const canvas=document.createElement("canvas")
const ctx=canvas.getContext("2d")

const size=500

canvas.width=size
canvas.height=size

ctx.beginPath()
ctx.arc(size/2,size/2,size/2,0,Math.PI*2)
ctx.clip()

const cropSize=cropArea.clientWidth
const scale=size/cropSize

ctx.drawImage(
img,
state.x*scale,
state.y*scale,
state.baseW*state.scale*scale,
state.baseH*state.scale*scale
)

appData.imageBase64=canvas.toDataURL()

document.getElementById("preview").src=appData.imageBase64

show("loading")

setTimeout(fakeAI,2000)

}

function fakeAI(){

const score=Math.floor(Math.random()*40)+60

show("result")

document.getElementById("resultImg").src=appData.imageBase64
document.getElementById("resultTitle").innerText="AI 評定完成"
document.getElementById("score").innerText=score
document.getElementById("feedback").innerText=
score>85?"構圖與主題表現非常優秀":"畫面有潛力，建議再加強細節"

}

function resetApp(){

document.getElementById("imageInput").value=""
location.reload()

}

</script>

</body>
</html>
