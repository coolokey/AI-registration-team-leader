<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 藝術掃描儀 v2</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#020617;
font-family:system-ui;
color:white;
overflow:hidden;
}

.glass{
background:rgba(15,23,42,.7);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.08);
}

.scan-ring{
position:absolute;
border:2px solid #22d3ee;
border-radius:50%;
animation:scan 3s linear infinite;
}

@keyframes scan{
0%{transform:scale(.3);opacity:1}
100%{transform:scale(1.5);opacity:0}
}

.scanner-line{
position:absolute;
height:3px;
width:100%;
background:#06b6d4;
box-shadow:0 0 15px #06b6d4;
animation:line 2s infinite linear;
}

@keyframes line{
0%{top:0}
100%{top:100%}
}

</style>
</head>

<body class="flex items-center justify-center h-screen">

<div id="app" class="w-[420px] h-[780px] glass rounded-3xl p-6 relative overflow-hidden">

<!-- LOGIN -->

<div id="screenLogin">

<h1 class="text-center text-2xl font-bold mb-6 text-cyan-400">
AI 藝術能量掃描儀
</h1>

<input id="studentId" placeholder="班級座號"
class="w-full bg-slate-800 p-3 rounded-xl mb-3">

<input id="studentName" placeholder="姓名"
class="w-full bg-slate-800 p-3 rounded-xl mb-4">

<button onclick="startApp()"
class="w-full bg-cyan-500 py-3 rounded-xl">
啟動掃描
</button>

</div>

<!-- UPLOAD -->

<div id="screenUpload" class="hidden">

<h2 class="text-center mb-4 text-cyan-400">
上傳畫作
</h2>

<div id="cropArea"
class="relative bg-black aspect-square rounded-xl overflow-hidden">

<label class="absolute inset-0 flex items-center justify-center cursor-pointer">

<input type="file" id="imgInput" class="hidden" accept="image/*">

<span class="text-cyan-400 text-lg">
點擊上傳
</span>

</label>

<img id="img" class="absolute hidden">

<div class="scanner-line"></div>

</div>

<input id="zoom"
type="range"
min="0.5"
max="3"
step="0.05"
value="1"
class="w-full mt-4">

<button onclick="scanAI()"
class="w-full bg-purple-500 mt-4 py-3 rounded-xl">
AI 掃描
</button>

</div>

<!-- LOADING -->

<div id="screenScan"
class="hidden flex flex-col items-center justify-center h-full">

<div class="relative w-40 h-40">

<div class="scan-ring w-40 h-40"></div>
<div class="scan-ring w-40 h-40" style="animation-delay:1s"></div>

</div>

<p class="mt-6 text-cyan-400">
AI 正在分析作品...
</p>

</div>

<!-- RESULT -->

<div id="screenResult" class="hidden">

<h2 class="text-center text-xl font-bold text-yellow-400">
AI 評分結果
</h2>

<img id="resultImg"
class="w-32 h-32 mx-auto rounded-full mt-4 border-4 border-yellow-400">

<div class="text-center text-4xl font-bold mt-4" id="score">
0
</div>

<canvas id="radar" height="220"></canvas>

<button onclick="downloadBadge()"
class="w-full mt-4 bg-green-500 py-3 rounded-xl">
下載胸章
</button>

<button onclick="location.reload()"
class="w-full mt-3 bg-slate-700 py-3 rounded-xl">
重新掃描
</button>

</div>

</div>

<script>

let appData={
imgBase64:""
}

function startApp(){
document.getElementById("screenLogin").classList.add("hidden")
document.getElementById("screenUpload").classList.remove("hidden")
}

const img=document.getElementById("img")
const input=document.getElementById("imgInput")

input.onchange=e=>{

const file=e.target.files[0]

const reader=new FileReader()

reader.onload=r=>{

img.src=r.target.result
img.classList.remove("hidden")

}

reader.readAsDataURL(file)

}

function scanAI(){

const canvas=document.createElement("canvas")
canvas.width=500
canvas.height=500

const ctx=canvas.getContext("2d")

ctx.beginPath()
ctx.arc(250,250,250,0,Math.PI*2)
ctx.clip()

ctx.drawImage(img,0,0,500,500)

appData.imgBase64=canvas.toDataURL()

document.getElementById("screenUpload").classList.add("hidden")
document.getElementById("screenScan").classList.remove("hidden")

setTimeout(showResult,2000)

}

function showResult(){

document.getElementById("screenScan").classList.add("hidden")
document.getElementById("screenResult").classList.remove("hidden")

document.getElementById("resultImg").src=appData.imgBase64

const theme=Math.floor(Math.random()*40)+60
const comp=Math.floor(Math.random()*40)+60
const tech=Math.floor(Math.random()*40)+60

const score=Math.round(theme*.4+comp*.4+tech*.2)

document.getElementById("score").innerText=score

new Chart(document.getElementById("radar"),{
type:"radar",
data:{
labels:["主題","構圖","技巧"],
datasets:[{
data:[theme,comp,tech],
borderColor:"#22d3ee",
backgroundColor:"rgba(34,211,238,.3)"
}]
},
options:{
scales:{
r:{
min:0,
max:100
}
}
}
})

}

function downloadBadge(){

const a=document.createElement("a")
a.href=appData.imgBase64
a.download="badge.png"
a.click()

}

</script>

</body>
</html>
