<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AI Badge Scanner v3</title>

<style>

body{
background:#020617;
color:#00eaff;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
margin-top:20px;
letter-spacing:3px;
}

#scanner{
width:420px;
height:420px;
margin:20px auto;
border:2px solid #00eaff;
border-radius:50%;
overflow:hidden;
position:relative;
background:black;
box-shadow:0 0 25px #00eaff;
}

#img{
position:absolute;
cursor:grab;
transform-origin:top left;
}

.scanline{
position:absolute;
width:100%;
height:3px;
background:#00ffff;
box-shadow:0 0 10px cyan;
animation:scan 3s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

#controls{
margin-top:10px;
}

button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:5px;
background:#00eaff;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0ff;
}

canvas{
margin-top:20px;
}

#result{
margin-top:20px;
font-size:18px;
}

#radar{
margin:auto;
}

</style>
</head>

<body>

<h1>AI 胸章掃描儀 v3</h1>

<input type="file" id="upload">

<div id="scanner">

<img id="img">

<div class="scanline"></div>

</div>

<div id="controls">

<button onclick="scan()">開始 AI 掃描</button>

<button onclick="download()">下載胸章</button>

<button onclick="reset()">重新開始</button>

</div>

<canvas id="badge" width="400" height="400"></canvas>

<canvas id="radar" width="400" height="400"></canvas>

<div id="result"></div>

<script>

let img=document.getElementById("img")

let scale=1
let posX=0
let posY=0

let drag=false
let startX
let startY

document.getElementById("upload").onchange=e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(ev){

img.src=ev.target.result

img.onload=function(){

scale=1
posX=0
posY=0
update()

}

}

reader.readAsDataURL(file)

}

function update(){

img.style.transform=
`translate(${posX}px,${posY}px) scale(${scale})`

}

img.onmousedown=e=>{

drag=true
startX=e.clientX-posX
startY=e.clientY-posY

}

document.onmousemove=e=>{

if(!drag)return

posX=e.clientX-startX
posY=e.clientY-startY

update()

}

document.onmouseup=()=>drag=false

document.getElementById("scanner").onwheel=e=>{

e.preventDefault()

scale+=e.deltaY*-0.001

if(scale<0.3)scale=0.3
if(scale>5)scale=5

update()

}

function scan(){

let canvas=document.getElementById("badge")

let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,400,400)

ctx.beginPath()
ctx.arc(200,200,200,0,Math.PI*2)
ctx.clip()

let rect=img.getBoundingClientRect()
let mask=document.getElementById("scanner").getBoundingClientRect()

let ratio=400/mask.width

let dx=(rect.left-mask.left)*ratio
let dy=(rect.top-mask.top)*ratio
let dw=rect.width*ratio
let dh=rect.height*ratio

ctx.drawImage(img,dx,dy,dw,dh)

aiAnalyze()

}

function aiAnalyze(){

let skills=["創造力","領導力","邏輯力","合作力","表達力"]

let scores=[]

for(let i=0;i<5;i++){

scores.push(Math.floor(Math.random()*40+60))

}

drawRadar(skills,scores)

let best=skills[scores.indexOf(Math.max(...scores))]

document.getElementById("result").innerHTML=

"AI 分析結果：你的最強能力是 <b>"+best+"</b>"

}

function drawRadar(labels,data){

let canvas=document.getElementById("radar")

let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,400,400)

let cx=200
let cy=200
let radius=150

let angle=Math.PI*2/labels.length

ctx.strokeStyle="#00ffff"

for(let i=0;i<labels.length;i++){

let a=i*angle-Math.PI/2

let x=cx+radius*Math.cos(a)
let y=cy+radius*Math.sin(a)

ctx.beginPath()
ctx.moveTo(cx,cy)
ctx.lineTo(x,y)
ctx.stroke()

ctx.fillText(labels[i],x,y)

}

ctx.beginPath()

for(let i=0;i<data.length;i++){

let r=radius*(data[i]/100)

let a=i*angle-Math.PI/2

let x=cx+r*Math.cos(a)
let y=cy+r*Math.sin(a)

if(i==0)ctx.moveTo(x,y)
else ctx.lineTo(x,y)

}

ctx.closePath()

ctx.fillStyle="rgba(0,255,255,0.3)"
ctx.fill()

ctx.stroke()

}

function download(){

let link=document.createElement("a")

link.download="badge.png"

link.href=document.getElementById("badge").toDataURL()

link.click()

}

function reset(){

location.reload()

}

</script>

</body>
</html>
