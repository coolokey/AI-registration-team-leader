<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AI Badge Scanner - Gemini</title>

<style>

body{
background:#030712;
color:#00f7ff;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
letter-spacing:3px;
margin-top:20px;
}

#scanner{
width:420px;
height:420px;
margin:20px auto;
border-radius:50%;
overflow:hidden;
border:3px solid cyan;
position:relative;
box-shadow:0 0 25px cyan;
background:black;
}

#img{
position:absolute;
transform-origin:top left;
cursor:grab;
}

.scanline{
position:absolute;
width:100%;
height:4px;
background:cyan;
animation:scan 3s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

button{
padding:10px 20px;
margin:10px;
border:none;
background:cyan;
color:black;
font-weight:bold;
cursor:pointer;
border-radius:5px;
}

canvas{
margin-top:20px;
}

#result{
width:600px;
margin:auto;
margin-top:20px;
font-size:18px;
line-height:1.6;
}

</style>

</head>

<body>

<h1>AI 胸章掃描系統</h1>

<input type="file" id="upload">

<div id="scanner">

<img id="img">

<div class="scanline"></div>

</div>

<div>

<button onclick="scan()">AI 掃描</button>

<button onclick="download()">下載胸章</button>

<button onclick="reset()">重新開始</button>

</div>

<canvas id="badge" width="400" height="400"></canvas>

<canvas id="radar" width="400" height="400"></canvas>

<div id="result"></div>

<script type="module">

import { GoogleGenerativeAI }
from "https://esm.run/@google/generative-ai"

const API_KEY="YOUR_GEMINI_API_KEY"

const genAI = new GoogleGenerativeAI(API_KEY)

const model = genAI.getGenerativeModel({
model:"gemini-1.5-flash"
})

let img=document.getElementById("img")

let scale=1
let posX=0
let posY=0

let dragging=false
let startX
let startY

document.getElementById("upload").onchange=e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(ev){

img.src=ev.target.result

img.onload=function(){

scale=1
posX=0
posY=0
update()

}

}

reader.readAsDataURL(file)

}

function update(){

img.style.transform=
`translate(${posX}px,${posY}px) scale(${scale})`

}

img.onmousedown=e=>{

dragging=true
startX=e.clientX-posX
startY=e.clientY-posY

}

document.onmousemove=e=>{

if(!dragging)return

posX=e.clientX-startX
posY=e.clientY-startY

update()

}

document.onmouseup=()=>dragging=false

document.getElementById("scanner").onwheel=e=>{

e.preventDefault()

scale+=e.deltaY*-0.001

if(scale<0.3)scale=0.3
if(scale>5)scale=5

update()

}

function scan(){

let canvas=document.getElementById("badge")

let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,400,400)

ctx.beginPath()
ctx.arc(200,200,200,0,Math.PI*2)
ctx.clip()

let rect=img.getBoundingClientRect()

let mask=document
.getElementById("scanner")
.getBoundingClientRect()

let ratio=400/mask.width

let dx=(rect.left-mask.left)*ratio
let dy=(rect.top-mask.top)*ratio

let dw=rect.width*ratio
let dh=rect.height*ratio

ctx.drawImage(img,dx,dy,dw,dh)

aiAnalyze()

}

async function aiAnalyze(){

let imageBase64=
document.getElementById("badge")
.toDataURL("image/png")
.split(",")[1]

const result = await model.generateContent([

"分析照片人物氣質並給五項能力評分（0-100）：創造力、領導力、邏輯力、合作力、表達力。請回傳 JSON",

{
inlineData:{
mimeType:"image/png",
data:imageBase64
}
}

])

const text=result.response.text()

document.getElementById("result").innerText=text

try{

let json=JSON.parse(text)

drawRadar(json)

}catch(e){

console.log("AI回傳格式非JSON")

}

}

function drawRadar(data){

let canvas=document.getElementById("radar")

let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,400,400)

let labels=Object.keys(data)
let values=Object.values(data)

let cx=200
let cy=200
let radius=150

let angle=(Math.PI*2)/labels.length

ctx.strokeStyle="cyan"

for(let i=0;i<labels.length;i++){

let a=i*angle-Math.PI/2

let x=cx+radius*Math.cos(a)
let y=cy+radius*Math.sin(a)

ctx.beginPath()
ctx.moveTo(cx,cy)
ctx.lineTo(x,y)
ctx.stroke()

ctx.fillText(labels[i],x,y)

}

ctx.beginPath()

for(let i=0;i<values.length;i++){

let r=radius*(values[i]/100)

let a=i*angle-Math.PI/2

let x=cx+r*Math.cos(a)
let y=cy+r*Math.sin(a)

if(i==0)ctx.moveTo(x,y)
else ctx.lineTo(x,y)

}

ctx.closePath()

ctx.fillStyle="rgba(0,255,255,0.3)"
ctx.fill()

ctx.stroke()

}

function download(){

let link=document.createElement("a")

link.download="badge.png"

link.href=document
.getElementById("badge")
.toDataURL()

link.click()

}

function reset(){

location.reload()

}

</script>

</body>
</html>
