<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣郵遞區號六碼查詢 | 3+3碼快速查詢工具</title>
    <meta name="description" content="台灣郵遞區號六碼（3+3碼）快速查詢工具，貼上地址即可快速查詢郵遞區號。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">📮</span>
                <span class="logo-text">郵遞區號查詢</span>
            </div>
            <div class="header-badge">3+3碼</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section -->
        <section class="hero">
            <h1 class="hero-title">
                <span class="hero-title-line">台灣郵遞區號</span>
                <span class="hero-title-accent">六碼快速查詢</span>
            </h1>
            <p class="hero-subtitle">貼上地址，立即取得 3+3 郵遞區號</p>
        </section>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-card" id="searchCard">
                <div class="search-card-glow"></div>
                <div class="search-card-content">
                    <label for="addressInput" class="input-label">
                        <span class="label-icon">🏠</span>
                        輸入或貼上完整地址
                    </label>
                    <div class="input-wrapper">
                        <textarea
                            id="addressInput"
                            class="address-input"
                            placeholder="例如：台北市中正區重慶南路一段122號"
                            rows="2"
                            autofocus
                        ></textarea>
                        <button class="paste-btn" id="pasteBtn" title="從剪貼簿貼上">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <button class="search-btn" id="searchBtn">
                        <span class="search-btn-text">查詢郵遞區號</span>
                        <span class="search-btn-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <span class="search-btn-loading" id="searchLoading">
                            <div class="spinner"></div>
                        </span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Result Section -->
        <section class="result-section" id="resultSection">
            <div class="result-card" id="resultCard">
                <!-- Success State -->
                <div class="result-success" id="resultSuccess" style="display:none;">
                    <div class="result-header">
                        <div class="result-icon-wrap">
                            <span class="result-icon">✅</span>
                        </div>
                        <h2 class="result-title">查詢成功</h2>
                    </div>
                    <div class="result-grid">
                        <!-- 6-digit code (primary) -->
                        <div class="result-item result-item-primary" id="resultZip6">
                            <div class="result-item-label">3+3 郵遞區號（六碼）</div>
                            <div class="result-item-value" id="zip6Value">--</div>
                            <button class="copy-btn" data-copy="zip6Value" title="複製">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span>複製</span>
                            </button>
                        </div>
                        <!-- 5-digit code -->
                        <div class="result-item" id="resultZip5">
                            <div class="result-item-label">3+2 郵遞區號（五碼）</div>
                            <div class="result-item-value" id="zip5Value">--</div>
                            <button class="copy-btn" data-copy="zip5Value" title="複製">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span>複製</span>
                            </button>
                        </div>
                        <!-- Full address with zip6 -->
                        <div class="result-item result-item-full">
                            <div class="result-item-label">完整地址（含六碼）</div>
                            <div class="result-item-value result-item-address" id="fullAddress6">--</div>
                            <button class="copy-btn" data-copy="fullAddress6" title="複製">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span>複製</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Error State -->
                <div class="result-error" id="resultError" style="display:none;">
                    <div class="result-header">
                        <div class="result-icon-wrap result-icon-error">
                            <span class="result-icon">❌</span>
                        </div>
                        <h2 class="result-title">查詢失敗</h2>
                    </div>
                    <p class="result-error-msg" id="errorMessage">請確認輸入的地址格式是否正確。</p>
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section class="history-section" id="historySection" style="display:none;">
            <div class="history-header">
                <h2 class="history-title">
                    <span class="history-icon">📋</span>
                    查詢紀錄
                </h2>
                <button class="history-clear-btn" id="clearHistoryBtn">清除紀錄</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <p>資料來源：<a href="https://www.post.gov.tw" target="_blank" rel="noopener noreferrer">中華郵政</a> ・ API 提供：<a href="https://zip5.5432.tw" target="_blank" rel="noopener noreferrer">zip5.5432.tw</a></p>
            <p class="footer-note">查詢結果僅供參考，如有疑慮請以中華郵政資料為準</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
