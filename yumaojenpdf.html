<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大貿險家電子書櫃</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --wood-dark: #5D4037;
      --wood-light: #8D6E63;
      --wall-color: #Fdfbf7;
      --book-width: 240px;
      --book-height: 170px;
      --primary-color: #6e48aa;
    }

    body { margin: 0; padding: 0; background-color: var(--wall-color); font-family: 'Noto Sans TC', sans-serif; color: #333; }
    
    header { 
      background: linear-gradient(135deg, #6e48aa, #9d50bb); 
      color: white; 
      padding: 20px; 
      text-align: center; 
      position: sticky; 
      top: 0; 
      z-index: 100;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    h1 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
    .subtitle { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
    
    .search-container { margin-top: 15px; }
    #searchInput {
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      width: 90%;
      max-width: 400px;
      font-size: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      outline: none;
    }

    /* 書櫃總容器 */
    .library-container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 20px;
    }

    /* 分類標題樣式 */
    .category-section {
      margin-bottom: 40px;
    }

    .category-header {
      display: flex;
      align-items: center;
      margin-bottom: 0px; /* 貼合書架 */
      padding-left: 10px;
    }

    .category-tag {
      background-color: var(--primary-color);
      color: white;
      padding: 8px 20px;
      border-radius: 10px 10px 0 0; /* 上方圓角 */
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      position: relative;
      top: 2px; /* 微調接合處 */
    }

    .bookshelf { 
      min-height: 100px; 
    }
    
    .shelf-row {
      display: flex;
      flex-wrap: wrap;
      padding: 0 20px;
      margin-bottom: 0; /* 緊湊排列 */
      border-bottom: 25px solid var(--wood-dark);
      border-top: 10px solid #795548; /* 書架頂部質感 */
      position: relative;
      min-height: 200px;
      background: linear-gradient(to bottom, #efebe9 0%, rgba(0,0,0,0.05) 100%);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
      border-radius: 0 10px 0 0; /* 右上角圓角 */
    }
    
    /* 書架陰影與立體感 */
    .shelf-row::after { 
      content: ''; position: absolute; bottom: -25px; left: -5px; right: -5px; height: 25px; 
      background-color: var(--wood-light); z-index: -1; border-radius: 0 0 5px 5px; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
    }
    
    /* 空狀態樣式 */
    .empty-shelf {
      width: 100%;
      height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #999;
      font-size: 1rem;
    }
    .empty-icon {
        font-size: 2rem;
        margin-bottom: 10px;
        opacity: 0.5;
    }
    
    .book {
      width: var(--book-width);
      height: var(--book-height);
      margin: 15px 15px 0 15px; /* 書本置底 */
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      transform-origin: bottom center;
      align-self: flex-end; /* 讓書本靠齊底部 */
    }
    
    .book:hover { transform: scale(1.05) translateY(-10px); z-index: 10; }
    
    .book-cover {
      width: 100%; height: 100%; background-color: #fff;
      border-radius: 2px 4px 4px 2px;
      box-shadow: inset 3px 0 2px rgba(0,0,0,0.1), 5px 5px 10px rgba(0,0,0,0.3);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }
    
    .book-cover::before { 
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; 
      width: 5px; background: rgba(0,0,0,0.1); z-index: 5; 
    }
    
    .book-img { width: 100%; height: 75%; object-fit: cover; background-color: #eee; }
    
    .book-title {
      padding: 5px 8px; font-size: 0.9rem; font-weight: bold; color: #333;
      text-align: center; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; background-color: white;
      flex-grow: 1; display: flex; align-items: center; justify-content: center;
    }
    
    .book-actions { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.7); display: flex; flex-direction: column; 
      justify-content: center; align-items: center; opacity: 0; 
      transition: opacity 0.3s; gap: 10px; 
    }
    
    .book:hover .book-actions { opacity: 1; }
    
    .action-btn { 
      background-color: white; color: #333; border: none; padding: 8px 16px; 
      border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; 
      text-decoration: none; display: flex; align-items: center; gap: 5px; 
    }
    .action-btn:hover { background-color: #f0f0f0; transform: scale(1.05); }
    .action-btn.primary { background-color: #ff9800; color: white; }

    #loader { text-align: center; padding: 50px; font-size: 1.2rem; color: #666; }
    .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 4px solid rgba(0,0,0,0.1); border-left-color: #9d50bb;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>大貿險家電子書櫃</h1>
    <div class="subtitle">同事共享教材資源庫</div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="搜尋講義名稱..." onkeyup="filterBooks()">
    </div>
  </header>

  <div id="loader">
    <div class="spinner"></div>
    <div>正在連線至雲端書庫...</div>
  </div>

  <div id="library" class="library-container"></div>

  <script>
    // ==========================================
    // GAS API 網址 (請確認是否與您部署的一致)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzw4nszdLHV3UZNW2190aybFFfacWmfY1c8dtP5B_-35Wylkd2LQ8aJEMS5VcFJSTPr-g/exec"; 
    // ==========================================

    let allBooks = [];

    // 定義分類規則：prefix 為英文代號
    const CATEGORIES = [
      { id: '7up',   prefix: '7up', title: '七年級 上學期' },
      { id: '7down', prefix: '7down', title: '七年級 下學期' },
      { id: '8up',   prefix: '8up', title: '八年級 上學期' },
      { id: '8down', prefix: '8down', title: '八年級 下學期' },
      { id: '9up',   prefix: '9up', title: '九年級 上學期' },
      { id: '9down', prefix: '9down', title: '九年級 下學期' }
    ];

    window.onload = function() {
      fetchBooks();
    };

    function fetchBooks() {
      fetch(GAS_API_URL)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                handleError(data.error);
            } else {
                handleSuccess(data);
            }
        })
        .catch(error => {
            handleError(error);
        });
    }

    function handleSuccess(data) {
      // 【修改重點】加入排序邏輯：依照檔名自然排序 (解決 1, 10, 2 順序問題)
      // 使用 localeCompare 搭配 numeric: true 可以正確排序數字
      allBooks = data.sort((a, b) => {
          return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
      });

      document.getElementById('loader').style.display = 'none';
      renderLibrary(allBooks);
    }

    function handleError(error) {
      console.error(error);
      document.getElementById('loader').innerHTML = `<span style="color:red">連線失敗，請檢查 API 網址或網路狀態。<br><small>${error}</small></span>`;
    }

    // 核心渲染函式
    function renderLibrary(books) {
      const libraryEl = document.getElementById('library');
      libraryEl.innerHTML = ''; // 清空

      // 遍歷每一個分類
      CATEGORIES.forEach(category => {
        // 不分大小寫比對檔名開頭
        const categoryBooks = books.filter(book => 
            book.name.toLowerCase().startsWith(category.prefix.toLowerCase())
        );
        
        // 建立該分類的區塊 HTML
        const section = document.createElement('div');
        section.className = 'category-section';

        // 標題
        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `<div class="category-tag">${category.title}</div>`;
        section.appendChild(header);

        // 書架容器
        const bookshelf = document.createElement('div');
        bookshelf.className = 'bookshelf';

        // 判斷是否有書
        if (categoryBooks.length === 0) {
            // 沒有書：顯示建立中
            const emptyShelf = document.createElement('div');
            emptyShelf.className = 'shelf-row';
            emptyShelf.innerHTML = `
                <div class="empty-shelf">
                    <div class="empty-icon"><i class="fas fa-tools"></i></div>
                    <div>講義建立中...</div>
                </div>
            `;
            bookshelf.appendChild(emptyShelf);
        } else {
            // 有書：進行排列
            // 計算一行能放幾本
            const containerWidth = 960; // 容器約略寬度
            const bookSpace = 280; // 橫式書本寬度含間距
            let booksPerRow = Math.floor(containerWidth / bookSpace) || 2;

            let currentShelfRow = document.createElement('div');
            currentShelfRow.className = 'shelf-row';
            bookshelf.appendChild(currentShelfRow);

            categoryBooks.forEach((book, i) => {
                if (i > 0 && i % booksPerRow === 0) {
                   currentShelfRow = document.createElement('div');
                   currentShelfRow.className = 'shelf-row';
                   bookshelf.appendChild(currentShelfRow);
                }
                currentShelfRow.appendChild(createBookElement(book));
            });
        }

        section.appendChild(bookshelf);
        libraryEl.appendChild(section);
      });
    }

    function createBookElement(book) {
      const div = document.createElement('div');
      div.className = 'book';
      const thumb = (book.thumbnail && book.thumbnail.length > 10) ? book.thumbnail : 'https://via.placeholder.com/240x170?text=PDF';

      div.innerHTML = `
        <div class="book-cover">
          <img src="${thumb}" class="book-img" onerror="this.src='https://via.placeholder.com/240x170?text=Cover'">
          <div class="book-title">${book.name}</div>
          <div class="book-actions">
            <a href="${book.url}" target="_blank" class="action-btn primary"><i class="fas fa-eye"></i> 預覽</a>
            <a href="${book.downloadUrl}" class="action-btn"><i class="fas fa-download"></i> 下載</a>
          </div>
        </div>
      `;
      return div;
    }
    
    function filterBooks() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      
      const filtered = allBooks.filter(book => book.name.toLowerCase().includes(filter));
      renderLibrary(filtered);
    }
  </script>
</body>
</html>
